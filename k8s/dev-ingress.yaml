apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-dev-ingress
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /dev/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: myapp-service
            port:
              number: 80