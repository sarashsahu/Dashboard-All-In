apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-dev-ingress
  namespace: dev
spec:
  ingressClassName: azure-application-gateway
  rules:
  - http:
      paths:
      - path: /dev
        pathType: Prefix
        backend:
          service:
            name: myapp-service
            port:
              number: 80