apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-prod-ingress
  namespace: prod
  annotations:
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: "spro-cert"
spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: spro.space
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myapp-service
            port:
              number: 80