trigger:
- main

pool:
  name: self-hosted-pool

variables:
  ACR_NAME: sarashcr
  AKS_NAME: aks
  RG: sarash-devops

stages:

# BUILD
- stage: Build
  jobs:
  - job: Build
    steps:
    - script: |
        az login --identity
        az acr login --name $ACR_NAME

        docker build -t $ACR_NAME.azurecr.io/myapp:latest .
        docker push $ACR_NAME.azurecr.io/myapp:latest

# APPROVAL DEV
- stage: Approval_Dev
  dependsOn: Build
  jobs:
  - job: Wait
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "Check and Approve deployment to DEV env."

# DEPLOY DEV
- stage: Deploy_Dev
  dependsOn: Approval_Dev
  jobs:
  - job: Deploy
    steps:
    - script: |
        az login --identity
        az aks get-credentials --name $AKS_NAME --resource-group $RG --overwrite-existing

        kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/dev.yaml
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/dev-ingress.yaml

# APPROVAL PROD
- stage: Approval_Prod
  dependsOn: Deploy_Dev
  jobs:
  - job: Wait
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "Check and Approve deployment to PROD env."

# DEPLOY PROD
- stage: Deploy_Prod
  dependsOn: Approval_Prod
  jobs:
  - job: Deploy
    steps:
    - script: |
        az login --identity
        az aks get-credentials --name $AKS_NAME --resource-group $RG --overwrite-existing

        kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/prod.yaml
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/prod-ingress.yaml