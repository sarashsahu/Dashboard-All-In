trigger:
- main

pool:
  name: self-hosted-pool

variables:
  ACR_NAME: sarashcr
  AKS_NAME: aks
  RG: sarash-devops

stages:

# ---------------- BUILD ----------------
- stage: Build
  jobs:
  - job: Build
    steps:
    - script: |
        az login --identity

        az acr login --name $ACR_NAME

        docker build -t $ACR_NAME.azurecr.io/myapp:latest .
        docker push $ACR_NAME.azurecr.io/myapp:latest
      displayName: Build and Push Image

# ---------------- APPROVAL BEFORE DEV ----------------
- stage: Approval_Dev
  dependsOn: Build
  jobs:
  - job: Wait
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "Approve deployment to DEV environment"

# ---------------- DEV DEPLOY ----------------
- stage: Deploy_Dev
  dependsOn: Approval_Dev
  jobs:
  - job: Deploy
    steps:
    - script: |
        az login --identity

        az aks get-credentials --name $AKS_NAME --resource-group $RG --overwrite-existing

        kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/dev.yaml
      displayName: Deploy to Dev

# ---------------- APPROVAL BEFORE PROD ----------------
- stage: Approval_Prod
  dependsOn: Deploy_Dev
  jobs:
  - job: Wait
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "Approve deployment to PROD"

# ---------------- PROD DEPLOY ----------------
- stage: Deploy_Prod
  dependsOn: Approval_Prod
  jobs:
  - job: Deploy
    steps:
    - script: |
        az login --identity

        az aks get-credentials --name $AKS_NAME --resource-group $RG --overwrite-existing

        kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/prod.yaml
      displayName: Deploy to Prod