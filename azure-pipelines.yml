trigger:
- main

pool:
  name: self-hosted-pool

variables:
  ACR_NAME: sarashcr
  AKS_NAME: aks
  RG: sarash-devops

stages:

# ---------------- BUILD IMAGE ----------------
- stage: Build_Image
  displayName: "Build & Push Docker Image to ACR"
  jobs:
  - job: Build
    displayName: "Build and Push Image"
    steps:
    - script: |
        az login --identity
        az acr login --name $ACR_NAME

        docker build -t $ACR_NAME.azurecr.io/myapp:$(Build.BuildId) .
        docker push $ACR_NAME.azurecr.io/myapp:$(Build.BuildId)
      displayName: "Docker Build & Push"

# ---------------- DEV APPROVAL ----------------
- stage: Approval_Dev
  displayName: "Approval: Deploy to Dev Environment"
  dependsOn: Build_Image
  jobs:
  - job: Wait_For_Dev_Approval
    displayName: "Waiting for Dev Approval"
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "Approve deployment to DEV environment for testing."

# ---------------- DEPLOY TO DEV ----------------
- stage: Deploy_Dev
  displayName: "Deploy Application to Dev"
  dependsOn: Approval_Dev
  jobs:
  - job: Deploy
    displayName: "Deploy to Dev Namespace"
    steps:
    - script: |
        az login --identity
        az aks get-credentials --name $AKS_NAME --resource-group $RG --overwrite-existing

        kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/dev.yaml
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/dev-ingress.yaml

        kubectl set image deployment/myapp \
          myapp=$ACR_NAME.azurecr.io/myapp:$(Build.BuildId) \
          -n dev
      displayName: "Deploy to Dev"

# ---------------- PROD APPROVAL ----------------
- stage: Approval_Prod
  displayName: "Approval: Deploy to Production"
  dependsOn: Deploy_Dev
  jobs:
  - job: Wait_For_Prod_Approval
    displayName: "Waiting for Production Approval"
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: "Approve deployment to PRODUCTION environment."

# ---------------- DEPLOY TO PROD ----------------
- stage: Deploy_Prod
  displayName: "Deploy Application to Production"
  dependsOn: Approval_Prod
  jobs:
  - job: Deploy
    displayName: "Deploy to Prod Namespace"
    steps:
    - script: |
        az login --identity
        az aks get-credentials --name $AKS_NAME --resource-group $RG --overwrite-existing

        kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/prod.yaml
        kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/prod-ingress.yaml

        kubectl set image deployment/myapp \
          myapp=$ACR_NAME.azurecr.io/myapp:$(Build.BuildId) \
          -n prod
      displayName: "Deploy to Production"