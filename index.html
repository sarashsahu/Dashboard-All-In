<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // DEVOPS_OS_v4.2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-green: #00ff9f;
            --dark-bg: #050505;
            --panel-bg: rgba(0, 20, 15, 0.8);
            --border-glow: 0 0 8px rgba(0, 255, 159, 0.3);
            --text-glow: 0 0 5px rgba(0, 255, 159, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: linear-gradient(rgba(0, 255, 159, 0.05) 1px, transparent 1px),
                              linear-gradient(90px, rgba(0, 255, 159, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: rgba(0, 10, 5, 0.95);
            border-right: 2px solid var(--neon-green);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 5px 0 15px rgba(0, 255, 159, 0.1);
            z-index: 5;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: var(--text-glow);
            border-bottom: 2px solid var(--neon-green);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .widget {
            border: 1px solid rgba(0, 255, 159, 0.3);
            padding: 12px;
            background: var(--panel-bg);
        }

        .widget-title { font-size: 10px; color: #008f5d; letter-spacing: 2px; }
        .widget-value { font-size: 18px; margin-top: 5px; color: #fff; text-shadow: var(--text-glow); }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            padding: 15px 30px;
            background: rgba(0, 255, 159, 0.05);
            border-bottom: 1px solid rgba(0, 255, 159, 0.2);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        .content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        /* Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(180px, auto);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 159, 0.3);
            border-radius: 4px;
            padding: 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--neon-green);
            box-shadow: var(--border-glow);
        }

        .card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 10px; height: 10px;
            border-top: 2px solid var(--neon-green); border-left: 2px solid var(--neon-green);
        }

        .title {
            font-size: 12px;
            color: var(--neon-green);
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        /* Specific Card Sizing */
        .deploy { grid-column: span 8; }
        .calc { grid-column: span 4; }
        .traffic { grid-column: span 4; }
        .error { grid-column: span 4; }
        .todo { grid-column: span 4; }

        /* Inputs & Buttons */
        button {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px 15px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            transition: 0.2s;
        }

        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: var(--border-glow);
        }

        input {
            background: rgba(0,0,0,0.5);
            border: 1px solid #004d30;
            color: var(--neon-green);
            padding: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        /* Calculator Styling */
        .calc-display {
            background: #000;
            padding: 15px;
            text-align: right;
            font-size: 20px;
            border: 1px inset rgba(0, 255, 159, 0.2);
            margin-bottom: 10px;
            height: 55px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        /* Task List */
        .todo-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(0, 255, 159, 0.1);
            font-size: 13px;
        }

        .done { color: #004d30; text-decoration: line-through; }

        @media (max-width: 1100px) {
            .deploy, .calc, .traffic, .error, .todo { grid-column: span 12; }
            .sidebar { width: 180px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand">CORE_OS</div>
    <div class="widget">
        <div class="widget-title">SYSTEM STATUS</div>
        <div class="widget-value" id="statusText">OPERATIONAL</div>
    </div>
    <div class="widget">
        <div class="widget-title">LOCAL TIME</div>
        <div id="clock" class="widget-value">00:00:00</div>
    </div>
    <div class="widget">
        <div class="widget-title">UPTIME</div>
        <div id="uptime" class="widget-value">00:00:00</div>
    </div>
    <div class="widget">
        <div class="widget-title">PROCESS TIMER</div>
        <div id="stopwatch" class="widget-value">00:00:00</div>
        <div style="margin-top:10px; display: flex; gap: 5px;">
            <button onclick="startSW()">RUN</button>
            <button onclick="stopSW()">HALT</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <span>SESSION: ROOT@DEVOPS_NODE_01</span>
        <span>SECURITY_LEVEL: ALPHA</span>
    </div>

    <div class="content">
        <div class="dashboard">

            <div class="card deploy">
                <div class="title"><span>SYSTEM_DEPLOYMENT_METRICS</span> <span>[LIVE]</span></div>
                <div style="height: 250px;">
                    <canvas id="chart1"></canvas>
                </div>
                <button onclick="deploy()" style="margin-top: 15px; width: 100%;">INITIALIZE NEW DEPLOYMENT</button>
            </div>

            <div class="card calc">
                <div class="title">MATH_CO-PROCESSOR</div>
                <div id="calcDisplay" class="calc-display">0</div>
                <div class="calc-grid">
                    <button onclick="p('7')">7</button><button onclick="p('8')">8</button><button onclick="p('9')">9</button><button onclick="p('/')">/</button>
                    <button onclick="p('4')">4</button><button onclick="p('5')">5</button><button onclick="p('6')">6</button><button onclick="p('*')">*</button>
                    <button onclick="p('1')">1</button><button onclick="p('2')">2</button><button onclick="p('3')">3</button><button onclick="p('-')">-</button>
                    <button onclick="p('0')">0</button><button onclick="calc()">=</button><button onclick="clr()">C</button><button onclick="p('+')">+</button>
                </div>
            </div>

            <div class="card traffic">
                <div class="title">NETWORK_TRAFFIC</div>
                <canvas id="chart2"></canvas>
            </div>

            <div class="card error">
                <div class="title">ERROR_LOG_FREQUENCE</div>
                <canvas id="chart3"></canvas>
            </div>

            <div class="card todo">
                <div class="title">EXECUTION_QUEUE</div>
                <div style="display:flex; gap: 5px; margin-bottom: 10px;">
                    <input id="todoInput" placeholder="CMD> Enter Task...">
                    <button onclick="addTodo()">PUSH</button>
                </div>
                <div id="todoList" class="todo-list">
                    </div>
            </div>

        </div>
    </div>
</div>

<script>
    // Universal Chart Config
    Chart.defaults.color = '#00ff9f';
    Chart.defaults.borderColor = 'rgba(0, 255, 159, 0.1)';

    let sec = 0;
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        sec++;
        document.getElementById('uptime').innerText = format(sec);
    }, 1000);

    function format(s) {
        let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
    }
    function pad(n) { return n < 10 ? '0' + n : n; }

    let sw = 0, swInt;
    function startSW() { if (swInt) return; swInt = setInterval(() => { sw++; document.getElementById('stopwatch').innerText = format(sw) }, 1000) }
    function stopSW() { clearInterval(swInt); swInt = null }

    function deploy() {
        const val = Math.floor(Math.random() * 10) + 1;
        chart1.data.labels.push("");
        chart1.data.datasets[0].data.push(val);
        chart1.update();
    }

    function addTodo() {
        let input = document.getElementById('todoInput');
        if (!input.value) return;
        let d = document.createElement('div');
        d.className = 'todo-item';
        d.innerHTML = `<span onclick="this.classList.toggle('done')">> ${input.value}</span><button onclick="this.parentElement.remove()" style="padding: 2px 5px; font-size: 8px;">DEL</button>`;
        document.getElementById('todoList').prepend(d);
        input.value = '';
    }

    let exp = '';
    const calcDisp = document.getElementById('calcDisplay');
    function p(x) { exp += x; calcDisp.innerText = exp; }
    function calc() { try { exp = eval(exp) + ''; calcDisp.innerText = exp; } catch { exp = ''; calcDisp.innerText = 'ERR'; } }
    function clr() { exp = ''; calcDisp.innerText = '0'; }

    // Charts Initialization
    const chart1 = new Chart(document.getElementById('chart1'), {
        type: 'line',
        data: {
            labels: ['01', '02', '03', '04', '05'],
            datasets: [{
                label: 'DEPLOY_VOL',
                data: [12, 19, 3, 5, 2],
                borderColor: '#00ff9f',
                tension: 0.4,
                fill: true,
                backgroundColor: 'rgba(0, 255, 159, 0.1)'
            }]
        },
        options: { maintainAspectRatio: false }
    });

    new Chart(document.getElementById('chart2'), {
        type: 'bar',
        data: {
            labels: ['NA', 'EU', 'AS'],
            datasets: [{
                label: 'TRAFFIC_GB',
                data: [45, 82, 60],
                backgroundColor: '#00ff9f'
            }]
        }
    });

    new Chart(document.getElementById('chart3'), {
        type: 'line',
        data: {
            labels: ['10m', '5m', '1m'],
            datasets: [{
                label: 'ERR_RATE',
                data: [1, 4, 2],
                borderColor: '#ff0055',
                backgroundColor: 'rgba(255, 0, 85, 0.1)',
                fill: true
            }]
        }
    });
</script>

</body>
</html>
